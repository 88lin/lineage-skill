<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc" lang="zh">
  <title id="title">不是总结课程，而是蒸馏老师</title>
  <desc id="desc">把老师没写下来的判断方式，提炼成能回查、能练习的 Skill</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAF8"/><stop offset="1" stop-color="#F4F2FA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#DDEFEA" stop-opacity="0.9"/><stop offset="1" stop-color="#DDEFEA" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B2B3A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5 1 9" fill="none" stroke="#8A97A3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="760" rx="28" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1439" height="759" rx="27.5" fill="none" stroke="#E6E3DC"/>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<text x="72.0" y="92.0" font-size="40" font-weight="750" fill="#17232E" text-anchor="start" letter-spacing="-0.5">不是总结课程，而是蒸馏老师</text><text x="72.0" y="134.0" font-size="18" font-weight="400" fill="#5B6B78" text-anchor="start">把老师没写下来的判断方式，提炼成能回查、能练习的 Skill</text>
<text x="72.0" y="202.0" font-size="14" font-weight="700" fill="#8A97A3" text-anchor="start" letter-spacing="1">老师的材料</text>
<rect x="72.0" y="222.0" width="300.0" height="56.0" rx="14" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="90" y="238" width="24" height="24" rx="7" fill="#E8F4F1" stroke="#2F8F83"/>
<text x="128.0" y="256.0" font-size="17" font-weight="600" fill="#17232E" text-anchor="start">课程视频</text>
<path d="M372 250C410 250 420 393 459 393" fill="none" stroke="#F1D2B0" stroke-width="2"/>
<rect x="72.0" y="292.0" width="300.0" height="56.0" rx="14" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="90" y="308" width="24" height="24" rx="7" fill="#ECF1FA" stroke="#4C6FB8"/>
<text x="128.0" y="326.0" font-size="17" font-weight="600" fill="#17232E" text-anchor="start">书与讲义</text>
<path d="M372 320C410 320 420 393 459 393" fill="none" stroke="#F1D2B0" stroke-width="2"/>
<rect x="72.0" y="362.0" width="300.0" height="56.0" rx="14" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="90" y="378" width="24" height="24" rx="7" fill="#F2EDF9" stroke="#7B5BB5"/>
<text x="128.0" y="396.0" font-size="17" font-weight="600" fill="#17232E" text-anchor="start">录音访谈</text>
<path d="M372 390C410 390 420 393 459 393" fill="none" stroke="#F1D2B0" stroke-width="2"/>
<rect x="72.0" y="432.0" width="300.0" height="56.0" rx="14" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="90" y="448" width="24" height="24" rx="7" fill="#EEF5EA" stroke="#5E8C4A"/>
<text x="128.0" y="466.0" font-size="17" font-weight="600" fill="#17232E" text-anchor="start">文章笔记</text>
<path d="M372 460C410 460 420 393 459 393" fill="none" stroke="#F1D2B0" stroke-width="2"/>
<rect x="72.0" y="502.0" width="300.0" height="56.0" rx="14" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="90" y="518" width="24" height="24" rx="7" fill="#FCF1E6" stroke="#C8732A"/>
<text x="128.0" y="536.0" font-size="17" font-weight="600" fill="#17232E" text-anchor="start">批注反馈</text>
<path d="M372 530C410 530 420 393 459 393" fill="none" stroke="#F1D2B0" stroke-width="2"/>
<path d="M436 228H632L586 558H482Z" fill="#FCF1E6" stroke="#F1D2B0" stroke-width="1.5" stroke-linejoin="round"/>
<text x="534.0" y="280.0" font-size="24" font-weight="800" fill="#C8732A" text-anchor="middle">蒸馏</text>
<path d="M470 312H598" stroke="#F1D2B0" stroke-dasharray="4 5"/>
<text x="534.0" y="344.0" font-size="15" font-weight="600" fill="#17232E" text-anchor="middle">转录识别</text>
<path d="M482 382H586" stroke="#F1D2B0" stroke-dasharray="4 5"/>
<text x="534.0" y="414.0" font-size="15" font-weight="600" fill="#17232E" text-anchor="middle">标注出处</text>
<path d="M494 452H574" stroke="#F1D2B0" stroke-dasharray="4 5"/>
<text x="534.0" y="484.0" font-size="15" font-weight="600" fill="#17232E" text-anchor="middle">提炼方法</text>
<path d="M611.0 393.0L662.0 393.0" stroke="#C8732A" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="676.0" y="202.0" font-size="14" font-weight="700" fill="#8A97A3" text-anchor="start" letter-spacing="1">蒸馏出的东西</text>
<rect x="676.0" y="222.0" width="336.0" height="116.0" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="676" y="242" width="5" height="76" rx="2.5" fill="#2F8F83"/>
<text x="702.0" y="262.0" font-size="19" font-weight="700" fill="#17232E" text-anchor="start">出处</text>
<text x="702.0" y="290.0" font-size="15" font-weight="400" fill="#5B6B78" text-anchor="start">每条结论对应的原文、原话、讲义页或画面</text>
<rect x="1032.0" y="222.0" width="336.0" height="116.0" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="1032" y="242" width="5" height="76" rx="2.5" fill="#4C6FB8"/>
<text x="1058.0" y="262.0" font-size="19" font-weight="700" fill="#17232E" text-anchor="start">观察点</text>
<text x="1058.0" y="290.0" font-size="15" font-weight="400" fill="#5B6B78" text-anchor="start">面对一个问题，老师先看什么、盯住什么</text>
<rect x="676.0" y="356.0" width="336.0" height="116.0" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="676" y="376" width="5" height="76" rx="2.5" fill="#4C6FB8"/>
<text x="702.0" y="396.0" font-size="19" font-weight="700" fill="#17232E" text-anchor="start">判断规则</text>
<text x="702.0" y="424.0" font-size="15" font-weight="400" fill="#5B6B78" text-anchor="start">凭哪些条件下结论，遇到例外怎么处理</text>
<rect x="1032.0" y="356.0" width="336.0" height="116.0" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="1032" y="376" width="5" height="76" rx="2.5" fill="#4C6FB8"/>
<text x="1058.0" y="396.0" font-size="19" font-weight="700" fill="#17232E" text-anchor="start">示范</text>
<text x="1058.0" y="424.0" font-size="15" font-weight="400" fill="#5B6B78" text-anchor="start">老师完整做一遍的过程和其中的关键步骤</text>
<rect x="676.0" y="490.0" width="336.0" height="116.0" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="676" y="510" width="5" height="76" rx="2.5" fill="#7B5BB5"/>
<text x="702.0" y="530.0" font-size="19" font-weight="700" fill="#17232E" text-anchor="start">常见错误与纠偏</text>
<text x="702.0" y="558.0" font-size="15" font-weight="400" fill="#5B6B78" text-anchor="start">学生通常错在哪里，老师会怎样指出</text>
<rect x="1032.0" y="490.0" width="336.0" height="116.0" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="1032" y="510" width="5" height="76" rx="2.5" fill="#C8732A"/>
<text x="1058.0" y="530.0" font-size="19" font-weight="700" fill="#17232E" text-anchor="start">适用边界</text>
<text x="1058.0" y="558.0" font-size="15" font-weight="400" fill="#5B6B78" text-anchor="start">什么情况下这套方法不能用</text>
<rect x="72.0" y="648.0" width="1296.0" height="64.0" rx="18" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1"/>
<text x="104.0" y="687.0" font-size="18" font-weight="500" fill="#8A97A3" text-anchor="start">摘要只留下：老师讲了什么</text>
<path d="M344.0 681.0L404.0 681.0" stroke="#C8732A" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="424.0" y="687.0" font-size="18" font-weight="750" fill="#2F8F83" text-anchor="start">蒸馏留下：老师会怎么做</text>
  </g>
</svg>
