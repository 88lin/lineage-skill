<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc" lang="zh">
  <title id="title">从老师的材料，到你自己的能力</title>
  <desc id="desc">老师那一侧可回查、生成后不改动；你这一侧私有，持续积累</desc>
