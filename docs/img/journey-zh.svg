<text x="415.5" y="366.0" font-size="18" font-weight="750" fill="#17232E" text-anchor="start">跟着做</text>
<text x="415.5" y="392.0" font-size="14" font-weight="400" fill="#5B6B78" text-anchor="start">有模板，</text><text x="415.5" y="413.0" font-size="14" font-weight="400" fill="#5B6B78" text-anchor="start">也有提示</text>
<rect x="563.2" y="260.0" width="149.8" height="210.0" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="563.25" y="278" width="5" height="174" rx="2.5" fill="#4C6FB8"/>
<circle cx="593.25" cy="300" r="15" fill="#ECF1FA" stroke="#4C6FB8" stroke-width="1.5"/>
<text x="593.2" y="305.0" font-size="14" font-weight="700" fill="#4C6FB8" text-anchor="middle">4</text>
<text x="579.2" y="346.0" font-size="18" font-weight="750" fill="#17232E" text-anchor="start">被纠偏</text>
<text x="579.2" y="372.0" font-size="14" font-weight="400" fill="#5B6B78" text-anchor="start">每次只抓</text><text x="579.2" y="393.0" font-size="14" font-weight="400" fill="#5B6B78" text-anchor="start">最关键的问题</text>
<rect x="727.0" y="240.0" width="149.8" height="230.0" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="727.0" y="258" width="5" height="194" rx="2.5" fill="#7B5BB5"/>
<circle cx="757.0" cy="280" r="15" fill="#F2EDF9" stroke="#7B5BB5" stroke-width="1.5"/>
