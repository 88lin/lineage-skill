<text x="743.0" y="326.0" font-size="18" font-weight="750" fill="#17232E" text-anchor="start">独立做</text>
<text x="743.0" y="352.0" font-size="14" font-weight="400" fill="#5B6B78" text-anchor="start">自己定方案，</text><text x="743.0" y="373.0" font-size="14" font-weight="400" fill="#5B6B78" text-anchor="start">自己完成</text>
<rect x="890.8" y="220.0" width="149.8" height="250.0" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="890.75" y="238" width="5" height="214" rx="2.5" fill="#7B5BB5"/>
<circle cx="920.75" cy="260" r="15" fill="#F2EDF9" stroke="#7B5BB5" stroke-width="1.5"/>
<text x="920.8" y="265.0" font-size="14" font-weight="700" fill="#7B5BB5" text-anchor="middle">6</text>
<text x="906.8" y="306.0" font-size="18" font-weight="750" fill="#17232E" text-anchor="start">换场景</text>
<text x="906.8" y="332.0" font-size="14" font-weight="400" fill="#5B6B78" text-anchor="start">没见过的问题</text><text x="906.8" y="353.0" font-size="14" font-weight="400" fill="#5B6B78" text-anchor="start">也会做</text>
<rect x="1054.5" y="200.0" width="149.8" height="270.0" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="1054.5" y="218" width="5" height="234" rx="2.5" fill="#5E8C4A"/>
<circle cx="1084.5" cy="240" r="15" fill="#EEF5EA" stroke="#5E8C4A" stroke-width="1.5"/>
<text x="1084.5" y="245.0" font-size="14" font-weight="700" fill="#5E8C4A" text-anchor="middle">7</text>
<text x="1070.5" y="286.0" font-size="18" font-weight="750" fill="#17232E" text-anchor="start">出师检验</text>
<text x="1070.5" y="312.0" font-size="14" font-weight="400" fill="#5B6B78" text-anchor="start">不给提示，</text><text x="1070.5" y="333.0" font-size="14" font-weight="400" fill="#5B6B78" text-anchor="start">隔段时间再测</text>
<rect x="1218.2" y="180.0" width="149.8" height="290.0" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="1218.25" y="198" width="5" height="254" rx="2.5" fill="#5E8C4A"/>
<circle cx="1248.25" cy="220" r="15" fill="#EEF5EA" stroke="#5E8C4A" stroke-width="1.5"/>
<text x="1248.2" y="225.0" font-size="14" font-weight="700" fill="#5E8C4A" text-anchor="middle">8</text>
<text x="1234.2" y="266.0" font-size="18" font-weight="750" fill="#17232E" text-anchor="start">持续精进</text>
<text x="1234.2" y="292.0" font-size="14" font-weight="400" fill="#5B6B78" text-anchor="start">形成你</text><text x="1234.2" y="313.0" font-size="14" font-weight="400" fill="#5B6B78" text-anchor="start">自己的方法</text>
<path d="M146.875 294L1273.125 154" stroke="#BFE0D9" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
<text x="1152.8" y="140.0" font-size="14" font-weight="700" fill="#2F8F83" text-anchor="end">你的独立程度</text>
<defs><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#2F8F83" stop-opacity="0.85"/><stop offset="1" stop-color="#2F8F83" stop-opacity="0.08"/></linearGradient></defs>
<text x="72.0" y="498.0" font-size="13" font-weight="700" fill="#8A97A3" text-anchor="start" letter-spacing="1">老师的支持</text>
<rect x="72.0" y="508.0" width="1296.0" height="12.0" rx="6" fill="url(#fade)"/>
<text x="72.0" y="546.0" font-size="14" font-weight="500" fill="#5B6B78" text-anchor="start">完整示范 + 提示</text>
<text x="1368.0" y="546.0" font-size="14" font-weight="500" fill="#5B6B78" text-anchor="end">只给最终反馈</text>
