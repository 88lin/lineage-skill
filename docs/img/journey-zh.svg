<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc" lang="zh">
  <title id="title">老师先扶着你，再慢慢放手</title>
  <desc id="desc">提示一点点减少，你的独立能力一点点显现</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAF8"/><stop offset="1" stop-color="#F4F2FA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#DDEFEA" stop-opacity="0.9"/><stop offset="1" stop-color="#DDEFEA" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B2B3A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5 1 9" fill="none" stroke="#8A97A3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1440" height="610" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="610" rx="28" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1439" height="609" rx="27.5" fill="none" stroke="#E6E3DC"/>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<text x="72.0" y="92.0" font-size="40" font-weight="750" fill="#17232E" text-anchor="start" letter-spacing="-0.5">老师先扶着你，再慢慢放手</text><text x="72.0" y="134.0" font-size="18" font-weight="400" fill="#5B6B78" text-anchor="start">提示一点点减少，你的独立能力一点点显现</text>
<rect x="72.0" y="320.0" width="149.8" height="150.0" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="72.0" y="338" width="5" height="114" rx="2.5" fill="#2F8F83"/>
<circle cx="102.0" cy="360" r="15" fill="#E8F4F1" stroke="#2F8F83" stroke-width="1.5"/>
<text x="102.0" y="365.0" font-size="14" font-weight="700" fill="#2F8F83" text-anchor="middle">1</text>
<text x="88.0" y="406.0" font-size="18" font-weight="750" fill="#17232E" text-anchor="start">定目标</text>
<text x="88.0" y="432.0" font-size="14" font-weight="400" fill="#5B6B78" text-anchor="start">目标、基础、</text><text x="88.0" y="453.0" font-size="14" font-weight="400" fill="#5B6B78" text-anchor="start">真实场景</text>
<rect x="235.8" y="300.0" width="149.8" height="170.0" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="235.75" y="318" width="5" height="134" rx="2.5" fill="#2F8F83"/>
<circle cx="265.75" cy="340" r="15" fill="#E8F4F1" stroke="#2F8F83" stroke-width="1.5"/>
<text x="265.8" y="345.0" font-size="14" font-weight="700" fill="#2F8F83" text-anchor="middle">2</text>
<text x="251.8" y="386.0" font-size="18" font-weight="750" fill="#17232E" text-anchor="start">看示范</text>
<text x="251.8" y="412.0" font-size="14" font-weight="400" fill="#5B6B78" text-anchor="start">老师怎么看、</text><text x="251.8" y="433.0" font-size="14" font-weight="400" fill="#5B6B78" text-anchor="start">怎么判断</text>
<rect x="399.5" y="280.0" width="149.8" height="190.0" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
