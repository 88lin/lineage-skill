<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740" role="img" aria-labelledby="title desc" lang="zh">
  <title id="title">一节课怎么上</title>
  <desc id="desc">讲清一个知识点，一起出两道题，分别点评，记下你的进度</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAF8"/><stop offset="1" stop-color="#F4F2FA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#DDEFEA" stop-opacity="0.9"/><stop offset="1" stop-color="#DDEFEA" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B2B3A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5 1 9" fill="none" stroke="#8A97A3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1440" height="740" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="740" rx="28" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1439" height="739" rx="27.5" fill="none" stroke="#E6E3DC"/>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<text x="72.0" y="92.0" font-size="40" font-weight="750" fill="#17232E" text-anchor="start" letter-spacing="-0.5">一节课怎么上</text><text x="72.0" y="134.0" font-size="18" font-weight="400" fill="#5B6B78" text-anchor="start">讲清一个知识点，一起出两道题，分别点评，记下你的进度</text>
<rect x="72.0" y="184.0" width="300.0" height="300.0" rx="20" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="94.0" y="206.0" width="34.8" height="26.0" rx="13.0" fill="#E8F4F1" stroke="#BFE0D9" stroke-width="1"/><text x="111.4" y="223.3" font-size="12" font-weight="700" fill="#2F8F83" text-anchor="middle" letter-spacing="1">01</text>
<text x="94.0" y="266.0" font-size="23" font-weight="750" fill="#17232E" text-anchor="start">选一个知识点</text>
<text x="94.0" y="292.0" font-size="14" font-weight="500" fill="#5B6B78" text-anchor="start">只讲你现在最需要的</text>
<path d="M378.0 334.0L396.0 334.0" stroke="#8A97A3" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="404.0" y="184.0" width="300.0" height="300.0" rx="20" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="426.0" y="206.0" width="37.0" height="26.0" rx="13.0" fill="#ECF1FA" stroke="#C9D6EE" stroke-width="1"/><text x="444.5" y="223.3" font-size="12" font-weight="700" fill="#4C6FB8" text-anchor="middle" letter-spacing="1">02</text>
<text x="426.0" y="266.0" font-size="23" font-weight="750" fill="#17232E" text-anchor="start">讲清楚</text>
<text x="426.0" y="292.0" font-size="14" font-weight="500" fill="#5B6B78" text-anchor="start">先讲直觉，再讲准确</text>
<path d="M710.0 334.0L728.0 334.0" stroke="#8A97A3" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="736.0" y="184.0" width="300.0" height="300.0" rx="20" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1" filter="url(#shadow)"/>
<rect x="758.0" y="206.0" width="37.0" height="26.0" rx="13.0" fill="#F2EDF9" stroke="#D9CCEE" stroke-width="1"/><text x="776.5" y="223.3" font-size="12" font-weight="700" fill="#7B5BB5" text-anchor="middle" letter-spacing="1">03</text>
<text x="758.0" y="266.0" font-size="23" font-weight="750" fill="#17232E" text-anchor="start">画出来</text>
<text x="758.0" y="292.0" font-size="14" font-weight="500" fill="#5B6B78" text-anchor="start">终端 ASCII 或 SVG 图示</text>
<path d="M1042.0 334.0L1060.0 334.0" stroke="#8A97A3" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
