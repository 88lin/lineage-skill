<circle cx="438" cy="360" r="7" fill="#FFFFFF" stroke="#4C6FB8" stroke-width="2"/>
<text x="458.0" y="365.0" font-size="15" font-weight="500" fill="#17232E" text-anchor="start">准确定义</text>
<circle cx="438" cy="390" r="7" fill="#FFFFFF" stroke="#4C6FB8" stroke-width="2"/>
<text x="458.0" y="395.0" font-size="15" font-weight="500" fill="#17232E" text-anchor="start">例子</text>
<circle cx="438" cy="420" r="7" fill="#FFFFFF" stroke="#4C6FB8" stroke-width="2"/>
<text x="458.0" y="425.0" font-size="15" font-weight="500" fill="#17232E" text-anchor="start">反例</text>
<circle cx="438" cy="450" r="7" fill="#FFFFFF" stroke="#4C6FB8" stroke-width="2"/>
<text x="458.0" y="455.0" font-size="15" font-weight="500" fill="#17232E" text-anchor="start">三点小结</text>
<rect x="758.0" y="322.0" width="256.0" height="112.0" rx="12" fill="#1E2830"/>
<text x="774.0" y="356.0" font-size="14" font-weight="500" fill="#CFE7E1" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'PingFang SC','Microsoft YaHei',monospace" xml:space="preserve">观察 ──▶ 判断 ──▶ 验证</text>
<text x="774.0" y="380.0" font-size="14" font-weight="500" fill="#9FB3C2" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'PingFang SC','Microsoft YaHei',monospace" xml:space="preserve">  │</text>
<text x="774.0" y="404.0" font-size="14" font-weight="500" fill="#9FB3C2" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'PingFang SC','Microsoft YaHei',monospace" xml:space="preserve">  └─ 复杂关系 → SVG</text>
<text x="758.0" y="462.0" font-size="13" font-weight="500" fill="#8A97A3" text-anchor="start">任何终端里都能看清</text>
<rect x="1090.0" y="316.0" width="256.0" height="58.0" rx="12" fill="#F2EDF9" stroke="#D9CCEE" stroke-width="1"/>
<text x="1104.0" y="340.0" font-size="14" font-weight="700" fill="#7B5BB5" text-anchor="start">① 检查理解</text>
<text x="1104.0" y="361.0" font-size="14" font-weight="500" fill="#17232E" text-anchor="start">这条规则在什么条件下成立？</text>
<rect x="1090.0" y="382.0" width="256.0" height="58.0" rx="12" fill="#ECF1FA" stroke="#C9D6EE" stroke-width="1"/>
<text x="1104.0" y="406.0" font-size="14" font-weight="700" fill="#4C6FB8" text-anchor="start">② 检查应用</text>
<text x="1104.0" y="427.0" font-size="14" font-weight="500" fill="#17232E" text-anchor="start">换到这个案例，你会怎么判断？</text>
<text x="1090.0" y="466.0" font-size="13" font-weight="500" fill="#8A97A3" text-anchor="start">不提前给答案</text>
