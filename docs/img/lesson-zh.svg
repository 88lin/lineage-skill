<text x="336.0" y="349.0" font-size="13" font-weight="600" fill="#8A97A3" text-anchor="end">已掌握</text>
<rect x="94.0" y="370.0" width="256.0" height="38.0" rx="10" fill="#E8F4F1" stroke="#BFE0D9" stroke-width="1"/>
<text x="108.0" y="395.0" font-size="15" font-weight="700" fill="#2F8F83" text-anchor="start">●</text>
<text x="132.0" y="395.0" font-size="15" font-weight="650" fill="#17232E" text-anchor="start">判断规则</text>
<text x="336.0" y="395.0" font-size="13" font-weight="600" fill="#2F8F83" text-anchor="end">今天</text>
<rect x="94.0" y="416.0" width="256.0" height="38.0" rx="10" fill="#F7F9F9" stroke="#E3E7EA" stroke-width="1"/>
