<text x="1090.0" y="266.0" font-size="23" font-weight="750" fill="#17232E" text-anchor="start">出两道题</text>
<text x="1090.0" y="292.0" font-size="14" font-weight="500" fill="#5B6B78" text-anchor="start">一起给出，等你作答</text>
