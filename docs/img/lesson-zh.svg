<text x="132.0" y="441.0" font-size="15" font-weight="500" fill="#5B6B78" text-anchor="start">示范</text>
<text x="336.0" y="441.0" font-size="13" font-weight="600" fill="#8A97A3" text-anchor="end">之后</text>
