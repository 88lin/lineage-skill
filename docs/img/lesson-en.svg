<text x="1090.0" y="266.0" font-size="23" font-weight="750" fill="#17232E" text-anchor="start">Ask two questions</text>
<text x="1090.0" y="292.0" font-size="14" font-weight="500" fill="#5B6B78" text-anchor="start">Shown together, then you answer</text>
<rect x="94.0" y="324.0" width="256.0" height="38.0" rx="10" fill="#F7F9F9" stroke="#E3E7EA" stroke-width="1"/>
<text x="108.0" y="349.0" font-size="15" font-weight="700" fill="#2F8F83" text-anchor="start">✓</text>
<text x="132.0" y="349.0" font-size="15" font-weight="500" fill="#17232E" text-anchor="start">Focus points</text>
<text x="336.0" y="349.0" font-size="13" font-weight="600" fill="#8A97A3" text-anchor="end">done</text>
<rect x="94.0" y="370.0" width="256.0" height="38.0" rx="10" fill="#E8F4F1" stroke="#BFE0D9" stroke-width="1"/>
<text x="108.0" y="395.0" font-size="15" font-weight="700" fill="#2F8F83" text-anchor="start">●</text>
<text x="132.0" y="395.0" font-size="15" font-weight="650" fill="#17232E" text-anchor="start">Judgment rules</text>
<text x="336.0" y="395.0" font-size="13" font-weight="600" fill="#2F8F83" text-anchor="end">today</text>
<rect x="94.0" y="416.0" width="256.0" height="38.0" rx="10" fill="#F7F9F9" stroke="#E3E7EA" stroke-width="1"/>
<text x="108.0" y="441.0" font-size="15" font-weight="700" fill="#8A97A3" text-anchor="start">○</text>
<text x="132.0" y="441.0" font-size="15" font-weight="500" fill="#5B6B78" text-anchor="start">Demonstrations</text>
<text x="336.0" y="441.0" font-size="13" font-weight="600" fill="#8A97A3" text-anchor="end">later</text>
<path d="M438 330v120" stroke="#C9D6EE" stroke-width="2"/>
